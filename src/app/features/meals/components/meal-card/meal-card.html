<mat-card
  class="meal-card"
  role="link"
  tabindex="0"
  (click)="openDetail()"
  (keydown.enter)="openDetail()"
>
  <div class="image-wrapper">
    <img
      [src]="meal.strMealThumb"
      [alt]="'Imagen de ' + meal.strMeal"
    />

    <span class="category-badge">
      {{ category }}
    </span>

    <button
      mat-icon-button
      type="button"
      class="favorite-button"
      [attr.aria-label]="favorite ? 'Quitar de favoritos' : 'Agregar a favoritos'"
      (click)="onToggleFavorite($event)"
    >
      <mat-icon>{{ favorite ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
  </div>

  <mat-card-content>
    <h2>{{ meal.strMeal }}</h2>

    <p class="meal-area">
      <mat-icon>public</mat-icon>
      {{ area }}
    </p>
  </mat-card-content>

  <mat-card-actions align="end">
    <span class="details-link">
      Ver receta
      <mat-icon>arrow_forward</mat-icon>
    </span>
  </mat-card-actions>
</mat-card>
